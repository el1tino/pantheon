# The 13 council seats. A run seats A–G by default.
# model_id values change often: confirm each one at https://openrouter.ai/models
# before relying on it (they are first used in milestone 2).
# sensitive_ok: false means the seat never receives files marked private.
# logo: a file in frontend/public/logos/ (without .svg), shown on the seat to identify the provider.
# There are no fixed roles: in the Roles phase each seat puts itself forward for work
# and the council votes on who does what.

seats:
